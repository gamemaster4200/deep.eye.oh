[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-eye-oh"
version = "0.0.1"
description = "Autonomous agent research project for diep.io, driven by screen capture and ordinary keyboard/mouse input."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10",
    "pywin32>=306",
]

[project.optional-dependencies]
dev = ["pytest"]
wiki = ["mwparserfromhell>=0.6", "py7zr>=0.20"]
knowledge = ["jsonschema>=4.18"]
browser = ["websockets>=12"]

[project.scripts]
deep-eye-oh = "deep_eye_oh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
