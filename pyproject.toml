[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-eye-oh"
version = "0.0.1"
description = "Autonomous agent research project for diep.io, driven by screen capture and ordinary keyboard/mouse input."
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
